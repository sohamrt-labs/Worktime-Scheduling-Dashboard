name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: pip install ruff==0.17.2 && ruff check .
      - run: pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-not-used-anywhere

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-12345678/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-only-password-1/' .env
          docker compose up -d --build
      -name: Smoke test through nginx (login + dashboard)
        run: |
          # Wait for backend health
          for i in $(seq 1 40); do
            curl -sf localhost:8080/api/health && break
            sleep 3
          done

          # Login and obtain access token
          TOKEN=$(curl -sf -d "username=admin&password=ci-only-password-1" localhost:8080/api/auth/login | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

          # Retrieve the logged-in user's business ID
          BUSINESS_ID=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            localhost:8080/api/businesses \
            | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")

          # Test dashboard with authentication and business context
          curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Business-Id: $BUSINESS_ID" \
            localhost:8080/api/dashboard > /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-secret-key-not-used-anywhere
      ADMIN_PASSWORD: ci-only-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to a real PostgreSQL
        run: alembic upgrade head
      - name: Models and migrations agree on PostgreSQL
        run: alembic check
      - name: Seed demo data (exercises inserts on PostgreSQL)
        run: python seed.py

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: DOMAIN=ci.example.com SECRET_KEY=x POSTGRES_PASSWORD=y CONTACT_EMAIL=a@b.co SMTP_HOST=smtp.b.co MAIL_FROM=a@b.co docker compose -f docker-compose.prod.yml config -q
