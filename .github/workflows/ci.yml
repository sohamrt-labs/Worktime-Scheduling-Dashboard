name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: pip install ruff==0.17.2 && ruff check .
      - name: Run backend tests
        run: pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-not-used-anywhere

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: ["backend", "frontend"]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-12345678/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-only-password-1/' .env
          docker compose up -d --build
      - name: Smoke test through nginx (health + login + dashboard)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "API did not become healthy in time"
              exit 1
            fi
            sleep 3
          done

          TOKEN="$(curl -fsS -d 'username=admin&password=ci-only-password-1' http://localhost:8080/api/auth/login | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test -n "$TOKEN"

          BUSINESS_ID="$(curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/businesses | python3 -c 'import json,sys; businesses=json.load(sys.stdin); assert businesses, "No businesses returned for admin"; print(businesses[0]["id"])')"
          test -n "$BUSINESS_ID"

          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Business-Id: $BUSINESS_ID" \
            http://localhost:8080/api/dashboard > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-secret-key-not-used-anywhere
      ADMIN_PASSWORD: ci-only-password-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to a real PostgreSQL
        run: alembic upgrade head
      - name: Models and migrations agree on PostgreSQL
        run: alembic check
      - name: Seed demo data (exercises inserts on PostgreSQL)
        run: python seed.py

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the production compose file
        run: >-
          DOMAIN=ci.example.com SECRET_KEY=x POSTGRES_PASSWORD=y
          CONTACT_EMAIL=a@b.co SMTP_HOST=smtp.b.co MAIL_FROM=a@b.co
          docker compose -f docker-compose.prod.yml config -q

