# Production stack: Caddy (HTTPS) -> nginx (static files) -> FastAPI -> PostgreSQL.
# Only Caddy is reachable from the internet. Run:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-worktime}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worktime} -d ${POSTGRES_DB:-worktime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-worktime}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-worktime}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-480}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      INVITE_CODE: ${INVITE_CODE:-}
      APP_URL: https://${DOMAIN}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env.production}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env.production (needed for email confirmation and password reset)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env.production}
    # Migrations run on every start (a no-op when up to date). One worker on purpose: the rate limiter is in memory.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]

volumes: { pg_data: {}, caddy_data: {}, caddy_config: {} }
